name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: pyinstaller MailBlast.spec

      - name: Zip the app
        run: |
          cd dist
          zip -r "MailBlast-Pro-macOS.zip" "MailBlast Pro.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailBlast-Pro-macOS
          path: dist/MailBlast-Pro-macOS.zip
          retention-days: 30
